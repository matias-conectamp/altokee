<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Altoke</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg text-center space-y-4">
        <h1 class="text-2xl font-bold text-gray-800">⚡ Prueba de Altoke</h1>
        <p class="text-gray-600 text-sm">Haz clic en el botón para probar si el sistema responde.</p>
        <button onclick="probarClick()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl shadow transition">
            Hacer clic aquí
        </button>
        <p id="resultado" class="text-emerald-600 font-bold text-lg"></p>
    </div>

    <script>
        function probarClick() {
            document.getElementById('resultado').innerText = "¡Funciona perfecto! 🚀";
            alert("¡El sistema responde correctamente!");
        }
    </script>
</body>
</html>
